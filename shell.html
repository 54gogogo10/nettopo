<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none';"/>
<title>网络拓扑管理软件 · Web Shell</title>
<link rel="stylesheet" href="css/style.css?v=20260906b"/>
<link rel="stylesheet" href="css/shell.css?v=20260906b"/>
<link rel="stylesheet" href="lib/xterm.css?v=20260906b"/>
</head>
<body class="shell-body">

<header class="sh-head">
  <div class="sh-brand"><b>网络拓扑管理软件</b><span>Web Shell</span></div>
  <div id="shTabs" class="sh-tabs" role="tablist"></div>
  <div class="sh-font" title="终端字体大小">
    <button id="shFontDec" class="sh-font-btn" title="减小字号 (Ctrl+-)">A−</button>
    <span id="shFontVal" class="sh-font-val">13</span>
    <button id="shFontInc" class="sh-font-btn" title="增大字号 (Ctrl+=)">A+</button>
  </div>
  <button id="shCastBtn" class="sh-cast-btn" title="多标签命令广播（SecureCRT Chat Window 模式）：勾选标签后，一条命令同时下发">⇉ 群发</button>
  <button id="shSftpBtn" class="sh-cast-btn" title="文件（SFTP）：浏览当前 SSH 会话的远程目录，上传 / 下载 / 重命名 / 删除（Telnet 会话不支持）">⇅ 文件</button>
  <button id="shBmBtn" class="sh-cast-btn" title="连接书签：保存的常用连接，双击即连（协议/地址/账号/编码，可记住密码）">☆ 书签</button>
  <button id="shSearchBtn" class="sh-cast-btn" title="终端搜索（Ctrl+F）：在当前标签的终端缓冲区中查找并高亮">🔍 搜索</button>
  <button id="shRecBtn" class="sh-cast-btn" title="会话录制：把当前所有标签的终端输出录制成 JSONL 录像（含时间戳，可回放）">⏺ 录制</button>
  <button id="shRecPlayBtn" class="sh-cast-btn" title="回放录像：选择已录制的会话录像，按原速/倍速回放">▶ 回放</button>
  <button id="shAiBtn" class="sh-cast-btn" title="AI 命令助手：输入自然语言需求，由 AI 生成命令并按所选权限模式在当前连接的终端上执行">✦ AI 助手</button>
  <button id="shNew" class="sh-new" title="新建连接（SSH / Telnet）">＋ 新建连接</button>
</header>

<main id="shTerms" class="sh-terms"></main>

<div id="shSearch" class="sh-search hidden" title="终端搜索：即输即搜，Enter / ↓ 下一个，Shift+Enter / ↑ 上一个，Esc 关闭">
  <span class="sh-cast-tag">搜索</span>
  <input id="shSearchInput" type="text" placeholder="在终端缓冲区中查找…" autocomplete="off" spellcheck="false"/>
  <span id="shSearchCount" class="sh-search-count"></span>
  <button id="shSearchPrev" class="sh-sftp-ib" title="上一个（Shift+Enter / ↑）">↑</button>
  <button id="shSearchNext" class="sh-sftp-ib" title="下一个（Enter / ↓）">↓</button>
  <button id="shSearchClose" class="sh-sftp-ib" title="关闭（Esc）">✕</button>
</div>

<div id="shPal" class="sh-pal hidden" title="快速命令面板（Ctrl+P）：快捷按钮 / 连接书签 / 历史命令，模糊搜索回车执行">
  <div class="sh-pal-box">
    <input id="shPalInput" type="text" placeholder="搜索快捷按钮 / 书签 / 历史命令…（Enter 执行，↑↓ 选择，Esc 关闭）" autocomplete="off" spellcheck="false"/>
    <div id="shPalList" class="sh-pal-list"></div>
  </div>
</div>

<div id="shCast" class="sh-cast hidden" title="多标签命令广播：勾选标签后，这里输入的命令同时发送到全部勾选的标签">
  <span class="sh-cast-tag">群发</span>
  <span id="shCastCount" class="sh-cast-count">已选 0 / 0</span>
  <input id="shCastInput" type="text" placeholder="输入命令，回车同时发送到勾选的标签（支持 \n 回车、\t 制表、\p 暂停；变量 {ip} {hostname} {port} {user} 按各标签实际值替换）" autocomplete="off" spellcheck="false"/>
  <label class="sh-cast-enter" title="发送后在命令末尾追加回车"><input id="shCastEnter" type="checkbox" checked/>回车</label>
  <button id="shCastSend" class="sh-cast-send" title="发送到勾选的标签（Enter）">发送</button>
  <button id="shCastDiff" class="sh-cast-send sh-cast-diff" title="汇总勾选标签的终端输出并标记差异行">对比</button>
</div>

<div id="shAi" class="sh-ai hidden" title="AI 命令助手：输入自然语言需求，AI 生成命令后按所选权限模式执行（需先在主窗口「AI 设置」中配置 AI 服务）">
  <span class="sh-cast-tag">AI</span>
  <select id="shAiDev" class="sh-ai-mode" title="设备类型：注入提示词让生成的命令贴合对应 CLI 语法；「自动识别」依据终端上下文判断">
    <option value="auto">自动识别设备类型</option>
    <option value="huawei">华为 VRP</option>
    <option value="h3c">H3C Comware</option>
    <option value="cisco">思科 IOS</option>
    <option value="juniper">Juniper Junos</option>
    <option value="linux">Linux Shell</option>
    <option value="windows">Windows 命令行</option>
  </select>
  <select id="shAiKind" class="sh-ai-mode" title="生成类型：逐条命令——生成查看/操作类命令；配置段——生成完整配置变更序列（含进入/退出配置模式命令）">
    <option value="cmd">逐条命令</option>
    <option value="config">配置段</option>
  </select>
  <select id="shAiMode" class="sh-ai-mode" title="执行权限模式：确认后执行——生成命令先展示，人工确认再下发；仅填入不执行——命令填入终端但不回车，人工检查后手动执行；直接执行——生成后立即下发到终端">
    <option value="confirm">确认后执行</option>
    <option value="fill">仅填入不执行</option>
    <option value="auto">直接执行</option>
  </select>
  <input id="shAiInput" type="text" placeholder="用自然语言描述要在当前终端执行的操作，例如：查看所有接口的 IP 地址和路由表" autocomplete="off" spellcheck="false"/>
  <label class="sh-ai-ctx" title="把当前标签终端的最近输出一并发给 AI 作为上下文（命令语法更贴合设备；内容会发送到「AI 设置」中配置的服务）"><input id="shAiCtx" type="checkbox" checked/>带终端输出</label>
  <button id="shAiSend" class="sh-cast-send" title="生成命令并按所选权限模式处理（Enter）">生成</button>
</div>
<div id="shAiResult" class="sh-ai-result hidden"></div>

<aside id="shSftp" class="sh-sftp hidden" title="SFTP 文件面板：基于当前 SSH 会话的远程文件浏览（Telnet 会话不支持）">
  <div class="sh-sftp-head">
    <b>文件（SFTP）</b>
    <span id="shSftpHost" class="sh-sftp-host"></span>
    <button id="shSftpClose" class="sh-sftp-x" title="关闭文件面板">✕</button>
  </div>
  <div class="sh-sftp-path">
    <button id="shSftpUp" class="sh-sftp-ib" title="上一级目录">↑</button>
    <button id="shSftpHome" class="sh-sftp-ib" title="回到主目录">~</button>
    <input id="shSftpPath" type="text" placeholder="远程路径，如 /var/log" spellcheck="false" autocomplete="off"/>
    <button id="shSftpGo" class="sh-sftp-ib" title="前往该目录">前往</button>
    <button id="shSftpRefresh" class="sh-sftp-ib" title="刷新目录">⟳</button>
  </div>
  <div class="sh-sftp-acts">
    <button id="shSftpMkdir" class="sh-sftp-ab">新建目录</button>
    <button id="shSftpUpload" class="sh-sftp-ab">上传…</button>
    <button id="shSftpDownload" class="sh-sftp-ab">下载</button>
    <button id="shSftpRename" class="sh-sftp-ab">重命名</button>
    <button id="shSftpDelete" class="sh-sftp-ab warn">删除</button>
  </div>
  <div id="shSftpList" class="sh-sftp-list"></div>
  <div id="shSftpStatus" class="sh-sftp-status">选择左侧 SSH 标签后自动浏览</div>
</aside>

<div id="shBbar" class="sh-bbar" title="右键管理快捷按钮">
  <div id="shBBtnWrap" class="sh-bbar-btns"></div>
  <button id="shBAdd" class="sh-bbar-add" title="新建快捷按钮（SecureCRT Button Bar 风格）">＋</button>
</div>

<div id="shEmpty" class="sh-empty hidden">
  <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M6.5 9.5l3 2.5-3 2.5"/><path d="M12 14.5h5.5"/></svg>
  <p>暂无连接</p>
  <small>在拓扑中右键设备选择「Web Shell」，或点击右上角「新建连接」。</small>
  <button class="tb primary" id="shEmptyNew"><i class="ic" data-ic="terminal"></i>新建连接</button>
</div>

<div id="modalRoot"></div>
<div id="shCtx" class="sh-ctx hidden"></div>

<script src="lib/xterm.js?v=20260906b"></script>
<script src="lib/xterm-addon-fit.js?v=20260906b"></script>
<script src="lib/xterm-addon-search.js?v=20260906b"></script>
<script src="js/shell-ui.js?v=20260906b"></script>
</body>
</html>
