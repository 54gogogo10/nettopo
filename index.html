<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>NetTopo · 网络拓扑设计器 v20260812k</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23fff'/%3E%3Ccircle cx='8' cy='8' r='2.6' fill='%23a5b4fc'/%3E%3Ccircle cx='24' cy='8' r='2.6' fill='%23a5b4fc'/%3E%3Ccircle cx='8' cy='24' r='2.6' fill='%23a5b4fc'/%3E%3Ccircle cx='24' cy='24' r='2.6' fill='%23a5b4fc'/%3E%3Cpath d='M8 8h6.2M24 8h-6.2M8 24h6.2M24 24h-6.2M16 11.5v4.5M13 20l3-4 3 4' stroke='%23a5b4fc' stroke-width='1.6' fill='none'/%3E%3C/svg%3E"/>
<link rel="stylesheet" href="css/style.css?v=20260812k"/>
<link rel="stylesheet" href="lib/xterm.css?v=20260812k"/>
</head>
<body>

<header id="toolbar">
  <div class="brand" title="NetTopo 网络拓扑设计器">
    <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="7" fill="#4f46e5"/><circle cx="16" cy="16" r="4.5" fill="#fff"/><circle cx="8" cy="8" r="2.6" fill="#a5b4fc"/><circle cx="24" cy="8" r="2.6" fill="#a5b4fc"/><circle cx="8" cy="24" r="2.6" fill="#a5b4fc"/><circle cx="24" cy="24" r="2.6" fill="#a5b4fc"/><path d="M8 8h6.2M24 8h-6.2M8 24h6.2M24 24h-6.2M16 11.5v4.5M13 20l3-4 3 4" stroke="#a5b4fc" stroke-width="1.6" fill="none"/></svg>
    <div class="brand-txt"><b>NetTopo</b><span>网络拓扑设计器</span></div>
  </div>

  <div class="sep"></div>
  <div class="tb-group">
    <button class="tb dd-btn" id="btnDropFile" title="文件：新建 / 导入表格 / 示例 / 保存工程 / 打开工程"><i class="ic" data-ic="fileplus"></i><span>文件</span><i class="ic caret" data-ic="caret"></i></button>
    <button class="tb dd-btn" id="btnDropEdit" title="编辑：添加设备 / 添加连线 / 类型管理 / 删除"><i class="ic" data-ic="node"></i><span>编辑</span><i class="ic caret" data-ic="caret"></i></button>
    <button class="tb dd-btn" id="btnDropLayout" title="布局：自动布局 / 适应视图 / 拓扑校验"><i class="ic" data-ic="layout"></i><span>布局</span><i class="ic caret" data-ic="caret"></i></button>
    <button class="tb dd-btn" id="btnDropView" title="显示：链路标注 / 子网分组"><i class="ic" data-ic="eye"></i><span>显示</span><i class="ic caret" data-ic="caret"></i></button>
    <button class="tb" id="btnUndo" title="撤销 (Ctrl+Z)"><i class="ic" data-ic="undo"></i><span>撤销</span></button>
    <button class="tb" id="btnRedo" title="重做 (Ctrl+Y)"><i class="ic" data-ic="redo"></i><span>重做</span></button>
  </div>

  <div class="spacer"></div>

  <div class="tb-group">
    <button class="tb dd-btn primary" id="btnDropExport" title="导出：CSV / Excel / PDF / 图片 / Visio"><i class="ic" data-ic="download"></i><span>导出</span><i class="ic caret" data-ic="caret"></i></button>
  </div>
  <div class="sep"></div>
  <button class="tb icon" id="btnTheme" title="切换明暗主题"><i class="ic" data-ic="moon"></i></button>
  <button class="tb icon" id="btnHelp" title="使用帮助"><i class="ic" data-ic="help"></i></button>
</header>

<main id="main">
  <section id="stage">
    <svg id="svg" role="img" aria-label="网络拓扑画布">
      <defs id="defs"></defs>
    </svg>

    <div id="empty" class="hidden">
      <div class="empty-card">
        <svg viewBox="0 0 64 64" width="72" height="72"><circle cx="32" cy="32" r="9" fill="none" stroke="url(#eg1)" stroke-width="3.4"/><circle cx="16" cy="16" r="5" fill="none" stroke="url(#eg1)" stroke-width="3"/><circle cx="48" cy="16" r="5" fill="none" stroke="url(#eg1)" stroke-width="3"/><circle cx="16" cy="48" r="5" fill="none" stroke="url(#eg1)" stroke-width="3"/><circle cx="48" cy="48" r="5" fill="none" stroke="url(#eg1)" stroke-width="3"/><path d="M32 23v9M22 20l7.4 6.6M42 20l-7.4 6.6M22 44l7.4-6.6M42 44l-7.4-6.6" stroke="url(#eg1)" stroke-width="2.4" stroke-linecap="round"/><defs><linearGradient id="eg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs></svg>
        <h2>从一张连线关系表开始，或直接新建</h2>
        <p>导入包含 <b>源设备 / 源接口 / 源IP / 目标设备 / 目标接口 / 目标IP</b> 的表格可自动生成拓扑图；没有表格时也可以<b>直接新建空白画布</b>，手动添加设备与连线。</p>
        <div class="empty-actions">
          <button class="tb primary big" id="btnEmptyImport"><i class="ic" data-ic="upload"></i><span>导入连线表格</span></button>
          <button class="tb big" id="btnEmptyNew"><i class="ic" data-ic="fileplus"></i><span>新建空白画布</span></button>
          <button class="tb big" id="btnEmptySample"><i class="ic" data-ic="wand"></i><span>载入示例拓扑</span></button>
        </div>
      </div>
    </div>

    <div id="tooltip" class="hidden"></div>

    <div id="zoomCtl" class="hidden">
      <button id="zOut" title="缩小">−</button>
      <span id="zVal">100%</span>
      <button id="zIn" title="放大">＋</button>
      <button id="zFit" title="适应视图">⤢</button>
    </div>

    <div id="selCard" class="hidden"></div>

    <div id="hintBar" class="hidden" onclick="if(window.__topo)window.__topo._closeHint&&window.__topo._closeHint()"></div>
  </section>

  <aside id="panel">
    <div class="panel-head">
      <div class="tabs">
        <button class="tab active" data-tab="nodes">设备 <span id="cntNodes" class="cnt">0</span></button>
        <button class="tab" data-tab="links">连线 <span id="cntLinks" class="cnt">0</span></button>
      </div>
      <button class="tb icon" id="btnPanel" title="收起面板"><i class="ic" data-ic="panel"></i></button>
    </div>
    <div class="search"><i class="ic" data-ic="search"></i><input id="searchInput" type="text" placeholder="搜索设备 / 接口 / IP…"/></div>
    <div id="listWrap"></div>
    <div id="legend"></div>
  </aside>
  <button id="panelOpen" class="hidden" title="展开面板"><i class="ic" data-ic="panel"></i></button>
</main>

<footer id="status">
  <span id="statGraph">设备 0 · 连线 0</span>
  <span id="statHint">提示：滚轮缩放 · 拖拽空白平移 · 双击设备/连线编辑 · 右键更多操作</span>
  <span id="statZoom"></span>
  <span id="statVer" title="当前版本">v20260812k</span>
</footer>

<input type="file" id="fileInput" accept=".csv,.txt,.xlsx,.xls" hidden/>
<input type="file" id="projInput" accept=".nettopo,.json" hidden/>
<div id="ctx" class="hidden"></div>
<div id="drop" class="hidden"></div>
<div id="modalRoot"></div>

<script src="lib/xlsx.full.min.js"></script>
<script src="js/util.js?v=20260812k"></script>
<script src="js/model.js?v=20260812k"></script>
<script src="js/layout.js?v=20260812k"></script>
<script src="js/visio.js?v=20260812k"></script>
<script src="js/vsdx.js?v=20260812k"></script>
<script src="js/pdf.js?v=20260812k"></script>
<script src="js/render.js?v=20260812k"></script>
<script src="lib/xterm.js?v=20260812k"></script>
<script src="lib/xterm-addon-fit.js?v=20260812k"></script>
<script src="js/app.js?v=20260812k"></script>
</body>
</html>
