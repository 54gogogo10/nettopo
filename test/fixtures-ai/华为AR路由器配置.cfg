#
sysname AR-HQ-R1
#
device id 2010
#
clock timezone Beijing add 08:00:00
clock daylight-saving-time CST repeating 01:00:00 last Sunday October 02:00:00 first Sunday April 01:00:00
#
vlan batch 10 20 30 99
#
dhcp enable
#
telnet server enable
#
http server enable
http server port 80
http timeout 20
#
info-center timestamp log date precision-time ms
info-center loghost 192.168.10.240
info-center loghost source Vlanif99
info-center source SHELL channel 6 log level debugging
#
snmp-agent
snmp-agent local-engineid 800007DB03F4E9A1B2C3D4
snmp-agent community read cipher public123
snmp-agent community write cipher private456
snmp-agent sys-info version v2c
snmp-agent sys-info contact netops@example.com
snmp-agent sys-info location HQ-DC-Rack-A4
snmp-agent target-host trap address udp-domain 192.168.10.240 params securityname nmsMonitor v2c
snmp-agent trap enable
#
acl number 2001
 rule 5 permit source any
#
acl number 3000
 rule 5 permit ip source 192.168.10.0 0.0.0.255
 rule 10 permit ip source 192.168.20.0 0.0.0.255
 rule 15 permit ip source 192.168.30.0 0.0.0.255
 rule 100 deny ip
#
acl number 3100
 rule 5 permit tcp destination-port eq telnet
 rule 10 permit tcp destination-port eq 22
 rule 15 deny ip
#
aaa
 authentication-scheme default
 authorization-scheme default
 accounting-scheme default
 domain default
 local-user admin password simple Huawei@123
 local-user admin privilege level 15
 local-user admin service-type telnet terminal ssh
 local-user guest password simple guest123
 local-user guest privilege level 1
 local-user guest service-type telnet
 local-user audit password irreversible-cipher $1a$Xy9!QwErTy$UiOpAsDfGhJkLzXcVbNm1234567890QwErTyUiOpAsDf$
 local-user audit privilege level 3
 local-user audit service-type ssh
#
interface LoopBack0
 description [RouterID]
 ip address 1.1.1.1 255.255.255.255
#
interface GigabitEthernet0/0/0
 description [WAN->ISP-CT]
 ip address 203.0.113.2 255.255.255.252
 nat outbound 3000
#
interface GigabitEthernet0/0/1
 description [LAN-Trunk-CoreSW]
 port link-type trunk
 port trunk allow-pass vlan 10 20 30 99
#
interface GigabitEthernet0/0/1.10
 description [Office-VLAN10]
 dot1q termination vid 10
 ip address 192.168.10.1 255.255.255.0
 arp broadcast enable
 dhcp select relay
 dhcp relay server-ip 192.168.99.10
#
interface GigabitEthernet0/0/1.20
 description [Finance-VLAN20]
 dot1q termination vid 20
 ip address 192.168.20.1 255.255.255.0
 arp broadcast enable
 dhcp select relay
 dhcp relay server-ip 192.168.99.10
#
interface GigabitEthernet0/0/1.30
 description [Guest-VLAN30]
 dot1q termination vid 30
 ip address 192.168.30.1 255.255.255.0
 arp broadcast enable
#
interface GigabitEthernet0/0/2
 description [To-Branch-R2]
 ip address 10.255.0.1 255.255.255.252
#
interface Vlanif99
 description [Mgmt]
 ip address 192.168.10.1 255.255.255.0
#
interface NULL0
#
ospf 1 router-id 1.1.1.1
 silent-interface GigabitEthernet0/0/1.10
 silent-interface GigabitEthernet0/0/1.20
 silent-interface GigabitEthernet0/0/1.30
 area 0.0.0.0
  authentication-mode simple cipher PlainOspfKey
  network 1.1.1.1 0.0.0.0
  network 10.255.0.0 0.0.0.3
  network 192.168.10.0 0.0.0.255
  network 192.168.20.0 0.0.0.255
#
ip route-static 0.0.0.0 0.0.0.0 203.0.113.1 preference 60
ip route-static 172.16.0.0 255.240.0.0 10.255.0.2 preference 60
#
nqa test-instance admin wanProbe
 test-type icmp
 destination-address ipv4 203.0.113.1
 frequency 60
 start now
#
ssh server enable
ssh server port 22
ssh server timeout 10
ssh server rekey-interval 24
ssh user admin authentication-type password
ssh user audit authentication-type password
rsa local-key-pair create
#
set cpu-usage threshold 80 restore 75
#
ntp-service unicast-server 192.168.10.250
#
user-interface con 0
 authentication-mode password
 set authentication password cipher %^%#Jq5!Vb2@Nc8$Xd9&Fg3*Hk7(Pl1)Wz4^Tm6#Rs0%Qa
 idle-timeout 10 0
user-interface vty 0 4
 acl 2001 inbound
 authentication-mode aaa
 protocol inbound telnet
 idle-timeout 30 0
user-interface vty 5 14
 authentication-mode aaa
 protocol inbound ssh
 idle-timeout 10 0
#
return
