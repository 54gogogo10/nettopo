<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8"/>
<title>NetTopo e2e 测试页</title>
<link rel="stylesheet" href="../css/style.css"/>
<script>
  // 预置主题与自动加载（e2e 专用）
  localStorage.setItem('nettopo.theme', 'light');
</script>
</head>
<body>
<!-- 复用 index.html 的结构 -->
<header id="toolbar">
  <div class="brand" title="NetTopo 网络拓扑设计器">
    <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="7" fill="#4f46e5"/><circle cx="16" cy="16" r="4.5" fill="#fff"/><circle cx="8" cy="8" r="2.6" fill="#a5b4fc"/><circle cx="24" cy="8" r="2.6" fill="#a5b4fc"/><circle cx="8" cy="24" r="2.6" fill="#a5b4fc"/><circle cx="24" cy="24" r="2.6" fill="#a5b4fc"/><path d="M8 8h6.2M24 8h-6.2M8 24h6.2M24 24h-6.2M16 11.5v4.5M13 20l3-4 3 4" stroke="#a5b4fc" stroke-width="1.6" fill="none"/></svg>
    <div class="brand-txt"><b>NetTopo</b><span>网络拓扑设计器</span></div>
  </div>
  <div class="sep"></div>
  <div class="tb-group">
    <button class="tb" id="btnNew"><i class="ic" data-ic="fileplus"></i><span>新建</span></button>
    <button class="tb primary" id="btnImport"><i class="ic" data-ic="upload"></i><span>导入表格</span></button>
    <button class="tb" id="btnSample"><i class="ic" data-ic="wand"></i><span>示例</span></button>
  </div>
  <div class="sep"></div>
  <div class="tb-group">
    <button class="tb" id="btnAddNode"><i class="ic" data-ic="node"></i><span>添加设备</span></button>
    <button class="tb" id="btnAddLink"><i class="ic" data-ic="link"></i><span>添加连线</span></button>
    <button class="tb" id="btnTypes"><i class="ic" data-ic="tag"></i><span>类型</span></button>
    <button class="tb danger" id="btnDelete"><i class="ic" data-ic="trash"></i><span>删除</span></button>
  </div>
  <div class="sep"></div>
  <div class="tb-group">
    <button class="tb" id="btnLayout"><i class="ic" data-ic="layout"></i><span>自动布局</span></button>
    <button class="tb" id="btnFit"><i class="ic" data-ic="fit"></i><span>适应视图</span></button>
  </div>
  <div class="sep"></div>
  <div class="tb-group">
    <button class="tb" id="btnUndo"><i class="ic" data-ic="undo"></i><span>撤销</span></button>
    <button class="tb" id="btnRedo"><i class="ic" data-ic="redo"></i><span>重做</span></button>
  </div>
  <div class="spacer"></div>
  <div class="tb-group">
    <button class="tb" id="btnCsv"><i class="ic" data-ic="csv"></i><span>导出CSV</span></button>
    <button class="tb" id="btnXlsx"><i class="ic" data-ic="xlsx"></i><span>导出Excel</span></button>
    <button class="tb" id="btnPdf"><i class="ic" data-ic="pdf"></i><span>导出PDF</span></button>
  </div>
  <div class="sep"></div>
  <button class="tb icon" id="btnTheme"><i class="ic" data-ic="moon"></i></button>
  <button class="tb icon" id="btnHelp"><i class="ic" data-ic="help"></i></button>
</header>

<main id="main">
  <section id="stage">
    <svg id="svg"><defs id="defs"></defs></svg>
    <div id="empty" class="hidden"><div class="empty-card"><h2>占位</h2><div class="empty-actions"><button id="btnEmptyImport">导入</button><button id="btnEmptySample">示例</button></div></div></div>
    <div id="tooltip" class="hidden"></div>
    <div id="zoomCtl" class="hidden">
      <button id="zOut">−</button><span id="zVal">100%</span>
      <button id="zIn">＋</button><button id="zFit">⤢</button>
    </div>
    <div id="selCard" class="hidden"></div>
    <div id="hintBar" class="hidden"></div>
  </section>
  <aside id="panel">
    <div class="panel-head">
      <div class="tabs">
        <button class="tab active" data-tab="nodes">设备 <span id="cntNodes" class="cnt">0</span></button>
        <button class="tab" data-tab="links">连线 <span id="cntLinks" class="cnt">0</span></button>
      </div>
      <button class="tb icon" id="btnPanel"><i class="ic" data-ic="panel"></i></button>
    </div>
    <div class="search"><i class="ic" data-ic="search"></i><input id="searchInput" type="text" placeholder="搜索设备 / 接口 / IP…"/></div>
    <div id="listWrap"></div>
    <div id="legend"></div>
  </aside>
  <button id="panelOpen" class="hidden"><i class="ic" data-ic="panel"></i></button>
</main>
<footer id="status">
  <span id="statGraph">设备 0 · 连线 0</span>
  <span id="statHint"></span>
  <span id="statZoom"></span>
</footer>
<input type="file" id="fileInput" hidden/>
<div id="ctx" class="hidden"></div>
<div id="modalRoot"></div>

<script src="../lib/xlsx.full.min.js"></script>
<script src="../js/util.js"></script>
<script src="../js/model.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/visio.js"></script>
<script src="../js/vsdx.js"></script>
<script src="../js/pdf.js"></script>
<script src="../js/vsdx.js"></script>
<script src="../js/render.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
