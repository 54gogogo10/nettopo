appId: com.nettopo.app
productName: 网络拓扑管理软件
electronDist: node_modules/electron/dist
directories:
  output: dist/portable
  buildResources: build
files:
  - index.html
  - shell.html
  - webview.html
  - electron-main.js
  - preload.js
  - package.json
  - icon.ico
  - icon.png
  - css/**/*
  - js/**/*
  - lib/**/*
win:
  icon: icon.ico
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: 网络拓扑管理软件-${version}-portable.exe
npmRebuild: false
